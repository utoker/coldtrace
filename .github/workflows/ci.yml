name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggers

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm --filter @coldtrace/logger build && pnpm --filter @coldtrace/database build && pnpm --filter @coldtrace/types build

  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify build artifacts
        run: |
          test -d apps/backend/dist
          test -d apps/frontend/.next
          test -d packages/logger/dist
          test -d packages/database/dist
          test -d packages/types/dist

  simulator-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Debug DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔍 Debugging DATABASE_URL..."
          echo "DATABASE_URL exists: $([ -n "$DATABASE_URL" ] && echo "true" || echo "false")"
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL starts with: ${DATABASE_URL:0:30}..."
            echo "DATABASE_URL ends with: ...${DATABASE_URL: -20}"
            echo "DATABASE_URL length: ${#DATABASE_URL}"
          fi

      - name: Start backend in background
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORT: 4000
          ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
        run: |
          echo "🚀 Starting backend in background..."
          pnpm --filter @coldtrace/backend start &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
          sleep 15
          echo "✅ Backend should be running on port 4000"
          echo "🔍 Testing GraphQL endpoint with correct query..."
          curl -X POST http://localhost:4000/graphql \
            -H "Content-Type: application/json" \
            -d '{"query": "query { getDevices { id name } }"}' || echo "GraphQL test failed"

      - name: Test simulator manually
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIM_INTERVAL_MINUTES: 1
          SIM_RUN_ONCE: true
        run: |
          echo "🧪 Testing simulator manually..."
          echo "DATABASE_URL is set: $([ -n "$DATABASE_URL" ] && echo "true" || echo "false")"
          echo "Backend should be running on http://localhost:4000"
          pnpm --filter @coldtrace/simulator start

      - name: Stop backend
        if: always()
        run: |
          echo "🛑 Stopping backend..."
          kill $BACKEND_PID || true
