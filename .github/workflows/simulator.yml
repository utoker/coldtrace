name: ColdTrace Simulator

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  simulate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build
        
      - name: Seed database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @coldtrace/database db:seed
        
      - name: Start backend in background
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORT: 4000
          ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
        run: |
          echo "🚀 Starting backend in background..."
          pnpm --filter @coldtrace/backend start &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          echo "Backend should be running on port 4000"
          sleep 15 # Give backend time to start
          echo "Backend started successfully"
          
      - name: Test GraphQL endpoint
        run: |
          echo "🔍 Testing GraphQL endpoint..."
          curl -X POST -H "Content-Type: application/json" \
            --data '{ "query": "{ getDevices { id name } }" }' \
            http://localhost:4000/graphql
          echo "GraphQL endpoint test completed"
        
      - name: Run simulator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIM_INTERVAL_MINUTES: 120
          SIM_RUN_ONCE: true
        run: |
          echo "🧪 Running simulator..."
          pnpm --filter @coldtrace/simulator start
          
      - name: Stop backend
        if: always()
        run: |
          echo "Stopping backend..."
          kill $BACKEND_PID || true