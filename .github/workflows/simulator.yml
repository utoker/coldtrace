name: ColdTrace Simulator

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Test Railway backend endpoint
        run: |
          echo "🔍 Testing Railway backend GraphQL endpoint..."
          curl -X POST -H "Content-Type: application/json" \
            --data '{ "query": "{ getDevices { id name } }" }' \
            https://coldtracebackend-production.up.railway.app/graphql
          echo "Railway backend GraphQL endpoint test completed"

      - name: Wake up Railway database
        run: |
          echo "🔄 Waking up Railway Postgres database..."
          for i in 1 2 3; do
            echo "⏳ Attempt $i of 3..."
            if curl -X POST -H "Content-Type: application/json" \
              --max-time 30 \
              --retry 2 \
              --retry-delay 5 \
              --data '{ "query": "{ getDevices { id name } }" }' \
              https://coldtracebackend-production.up.railway.app/graphql 2>&1 | grep -q "data"; then
              echo "✅ Database is awake and responding with data"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "⏳ Database not ready, waiting 15 seconds before retry..."
              sleep 15
            fi
          done
          echo "❌ Failed to wake database after 3 attempts"
          exit 1

      - name: Run simulator
        env:
          GRAPHQL_ENDPOINT: https://coldtracebackend-production.up.railway.app/graphql
          SIM_INTERVAL_MINUTES: 120
          SIM_RUN_ONCE: true
        run: |
          echo "🧪 Running simulator to generate reading data..."
          echo "Using Railway backend: $GRAPHQL_ENDPOINT"
          pnpm --filter @coldtrace/simulator start
