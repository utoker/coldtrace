name: ColdTrace Simulator

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Test Railway backend endpoint
        run: |
          echo "🔍 Testing Railway backend GraphQL endpoint..."
          curl -X POST -H "Content-Type: application/json" \
            --data '{ "query": "{ getDevices { id name } }" }' \
            https://coldtracebackend-production.up.railway.app/graphql
          echo "Railway backend GraphQL endpoint test completed"

      - name: Run simulator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GRAPHQL_ENDPOINT: https://coldtracebackend-production.up.railway.app/graphql
          SIM_INTERVAL_MINUTES: 120
          SIM_RUN_ONCE: true
        run: |
          echo "🧪 Running simulator to generate reading data..."
          echo "Using Railway backend: $GRAPHQL_ENDPOINT"
          pnpm --filter @coldtrace/simulator start
